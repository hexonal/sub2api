name: Sync upstream

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-main:
    if: github.repository == 'hexonal/sub2api'
    runs-on: ubuntu-latest
    steps:
      - name: Sync main with Wei-Shaw/sub2api
        env:
          # PAT with repo + workflow scope; GITHUB_TOKEN cannot push upstream workflow changes
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::SYNC_TOKEN secret is not configured"
            exit 1
          fi
          gh api -X POST "repos/${{ github.repository }}/merge-upstream" -f branch=main
